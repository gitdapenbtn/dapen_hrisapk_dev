name: dpbtn_absen
description: "Aplikasi absen untuk karyawan Dana Pensiun BTN."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.0+10

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.12.3
  location: ^8.0.1
  permission_handler: ^12.0.1
  unicons: ^3.0.0
  camera: ^0.11.1
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.9
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.3.0
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  path: ^1.9.1
  dropdown_search: ^6.0.2
  http: ^1.4.0
  provider: ^6.1.5
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  datetime_setting: ^2.0.3
  upgrader: ^11.4.0
  package_info_plus: ^8.3.0
  sentry_flutter: ^9.3.0
  syncfusion_flutter_pdfviewer: ^30.1.38
  dotted_border: ^3.1.0
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_icon.jpg"